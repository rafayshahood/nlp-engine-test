name: Linux

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build_engine:
    name: Build NLP-ENGINE on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, ubuntu-20.04] # Testing multiple Linux versions

    env:
      VCPKG_DEFAULT_TRIPLET: x64-linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf-archive

      - name: Setup Vcpkg
        run: |
          ./bootstrap-vcpkg.sh
          vcpkg install
        working-directory: vcpkg

      - name: Create Build Directory
        run: mkdir -p build

      - name: Configure CMake
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -DVCPKG_BUILD_TYPE=release -B build -S . \
                -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build Project
        run: cmake --build build/ --target all

      - name: Test Executable
        run: ./bin/nlp --version || true

      - name: Checkout Analyzers Repo
        uses: actions/checkout@v3
        with:
          repository: VisualText/analyzers
          submodules: recursive
          path: analyzers

      - name: Run English Parser Test
        run: ./bin/nlp -ANA ./analyzers/parse-en-us -WORK ./ ./analyzers/parse-en-us/input/doj.txt -DEV || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nlp-binaries-${{ matrix.os }}
          path: bin/nlp

      - name: Upload ICU Libraries
        uses: actions/upload-artifact@v4
        with:
          name: icu-libs-${{ matrix.os }}
          path: vcpkg_installed/x64-linux/lib/libicu*.a

      - name: Full English Test
        uses: LouisBrunner/diff-action@v0.2.0
        with:
          old: .github/workflows/tests/parse-en-us/final.tree
          new: ./analyzers/parse-en-us/input/doj.txt_log/final.tree
          mode: addition
          tolerance: same
          output: parse-en-us-diff-${{ matrix.os }}.txt