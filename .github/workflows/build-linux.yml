name: Linux

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
      
jobs:
  build_engine:
    name: Build NLP-ENGINE
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-20.04, ubuntu-22.04, ubuntu-latest]

    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.arch == 'x86_64' && 'x64-linux' || 'arm64-linux' }}
      

    steps:
    
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Set Architecture & Triplet
        run: |
          if [[ "${{ matrix.arch }}" == "x86_64" ]]; then
            echo "VCPKG_DEFAULT_TRIPLET=x64-linux" >> $GITHUB_ENV
          else
            echo "VCPKG_DEFAULT_TRIPLET=arm64-linux" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf-archive build-essential cmake ninja-build curl unzip tar pkg-config libicu-dev

          
      - name: Vcpkg Bootstrap Shell
        run: ./bootstrap-vcpkg.sh
        shell: bash
        working-directory: vcpkg

      - name: Install 3rd Party
        run: vcpkg install
        working-directory: vcpkg

      - name: Create Build Directory
        run: mkdir -p build

      - name: Generate Build Files
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DVCPKG_BUILD_TYPE=release \
                -B build \
                -S . \
                -DCMAKE_TOOLCHAIN_FILE='${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake'

                
      - name: Build NLP Engine
        run: cmake --build build/ --target all

      - name: Test Executable Version
        run: ./bin/nlp --version || true
        
      - name: Upload Built Executable
        uses: actions/upload-artifact@v4
        with:
          name: nlp-engine-bin-${{ matrix.os }}
          path: bin/nlp

      - name: Checkout Analyzers Repo
        uses: actions/checkout@v3
        with:
          repository: VisualText/analyzers
          submodules: recursive
          path: analyzers

      - name: Run English Parser Test
        run: ./bin/nlp -ANA ./analyzers/parse-en-us -WORK ./ ./analyzers/parse-en-us/input/doj.txt -DEV || true

      - name: Full English Test
        uses: LouisBrunner/diff-action@v0.2.0
        with:
          old: .github/workflows/tests/parse-en-us/final.tree
          new: ./analyzers/parse-en-us/input/doj.txt_log/final.tree
          mode: addition
          tolerance: same
          output: parse-en-us-diff-lin.txt