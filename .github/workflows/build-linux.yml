name: Linux

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
      
jobs:
  build_engine:
    name: Build NLP-ENGINE
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, ubuntu-20.04] 
        

    env:
      VCPKG_DEFAULT_TRIPLET: x64-linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install Required Dependencies
        run: |
          sudo apt update
          sudo apt install -y autoconf-archive pkg-config python3 ninja-build build-essential cmake g++ git curl zip unzip tar

          if [[ "${{ matrix.os }}" == "ubuntu-20.04" ]]; then
            sudo apt install -y libicu-dev
          fi

      # ✅ Debug: Capture System Info Before Build
      - name: Capture System Info (Ubuntu 20.04)
        if: matrix.os == 'ubuntu-20.04'
        run: |
          echo "🔍 Checking system info..."
          uname -a
          lsb_release -a || cat /etc/os-release
          echo "🔍 Checking available memory..."
          free -h
          echo "🔍 Checking environment variables..."
          env | sort

      # ✅ Ensure ICU Paths are Set for Ubuntu 20.04
      - name: Fix ICU Paths for Ubuntu 20.04
        if: matrix.os == 'ubuntu-20.04'
        run: |
          echo "🔍 Setting up ICU paths for Ubuntu 20.04..."
          echo 'export LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH' >> ~/.bashrc
          echo 'export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:$PKG_CONFIG_PATH' >> ~/.bashrc
          source ~/.bashrc
          echo "✅ ICU paths configured."


      - name: Vcpkg Bootstrap Shell
        run: ./bootstrap-vcpkg.sh
        shell: bash
        working-directory: vcpkg

      - name: Install 3rd Party
        run: vcpkg install
        working-directory: vcpkg

      - name: Create Build Directory
        run: mkdir -p build

      - name: Generate Solution Linux
        run: cmake -DCMAKE_BUILD_TYPE=Release -DVCPKG_BUILD_TYPE=release -B build -S . -DCMAKE_TOOLCHAIN_FILE='${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake'

      - name: Cmake Build all targets Linux
        run: cmake --build build/ --target all


      - name: Test executable --version
        run: ./bin/nlp --version || true

      - name: Copy nlp.exe to nlpl.exe
        run: cp bin/nlp bin/nlpl.exe
        shell: bash


      # ✅ Upload Executable with Updated Naming
      - name: Upload nlpl.exe (Ubuntu 20.04)
        if: matrix.os == 'ubuntu-20.04'
        uses: actions/upload-artifact@v4
        with:
          name: nlpl-ubuntu-20.04.exe
          path: bin/nlpl.exe

      - name: Upload nlpl.exe (Ubuntu 22.04)
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: nlpl-ubuntu-22.04.exe
          path: bin/nlpl.exe

      - name: Upload nlpl.exe (Ubuntu Latest)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nlpl-ubuntu-latest.exe
          path: bin/nlpl.exe


      # ✅ Upload Libraries with Updated Naming
      - name: Upload libicutu (Ubuntu 20.04)
        if: matrix.os == 'ubuntu-20.04'
        uses: actions/upload-artifact@v4
        with:
          name: libicutu-ubuntu-20.04.a
          path: vcpkg_installed/x64-linux/lib/libicutu.a

      - name: Upload libicutu (Ubuntu 22.04)
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: libicutu-ubuntu-22.04.a
          path: vcpkg_installed/x64-linux/lib/libicutu.a

      - name: Upload libicutu (Ubuntu Latest)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: libicutu-ubuntu-latest.a
          path: vcpkg_installed/x64-linux/lib/libicutu.a

      - name: Upload libicuuc (Ubuntu 20.04)
        if: matrix.os == 'ubuntu-20.04'
        uses: actions/upload-artifact@v4
        with:
          name: libicuuc-ubuntu-20.04.a
          path: vcpkg_installed/x64-linux/lib/libicuuc.a

      - name: Upload libicuuc (Ubuntu 22.04)
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: libicuuc-ubuntu-22.04.a
          path: vcpkg_installed/x64-linux/lib/libicuuc.a

      - name: Upload libicuuc (Ubuntu Latest)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: libicuuc-ubuntu-latest.a
          path: vcpkg_installed/x64-linux/lib/libicuuc.a


      - name: Checkout Analyzers Repo
        uses: actions/checkout@v3
        with:
          repository: VisualText/analyzers
          submodules: recursive
          path: analyzers

      - name: Run English Parser Test
        run: ./bin/nlp -ANA ./analyzers/parse-en-us -WORK ./ ./analyzers/parse-en-us/input/doj.txt -DEV || true



      # ✅ Debug: ICU Installation & Paths
      - name: Debug ICU Installation (Ubuntu 20.04)
        if: matrix.os == 'ubuntu-20.04'
        run: |
          echo "🔍 Checking ICU Installation..."
          ls -l vcpkg_installed/x64-linux/lib || echo "⚠️ ICU libraries missing!"
          echo "🔍 ICU Libraries in System:"
          ldconfig -p | grep icu || echo "⚠️ ICU not found in system libraries!"

      # ✅ Debug: NLP Execution & Crash Info
      - name: Debug NLP Execution (Ubuntu 20.04)
        if: matrix.os == 'ubuntu-20.04'
        run: |
          echo "🔍 Running NLP Execution..."
          ./bin/nlp -ANA ./analyzers/parse-en-us -WORK ./ ./analyzers/parse-en-us/input/doj.txt -DEV || echo "⚠️ NLP execution failed!"

          echo "📂 Checking directory contents after NLP execution..."
          ls -l ./analyzers/parse-en-us/input/ || echo "⚠️ No input files generated!"
          ls -l ./analyzers/parse-en-us/input/doj.txt_log/ || echo "⚠️ doj.txt_log not created!"

          echo "📜 Checking NLP logs..."
          cat .//vtrun_logfile.out || echo "⚠️ No log file found!"

      # ✅ Debug: Capture Core Dump & System Logs
      - name: Debug System Logs & Core Dump (Ubuntu 20.04)
        if: matrix.os == 'ubuntu-20.04'
        run: |
          echo "🔍 Checking dmesg logs for segmentation faults..."
          dmesg | tail -50 || echo "⚠️ No dmesg logs found!"
          
          echo "🔍 Checking linked libraries for nlp binary..."
          ldd ./bin/nlp || echo "⚠️ Missing shared libraries!"

      # ✅ Debug: Checking `final.tree` File
      - name: Debug Output for Ubuntu 20.04
        if: matrix.os == 'ubuntu-20.04'
        run: |
          echo "🔍 Checking if final.tree exists..."
          ls -l ./analyzers/parse-en-us/input/doj.txt_log || echo "⚠️ doj.txt_log folder is missing!"
          ls -l ./analyzers/parse-en-us/input/doj.txt_log/final.tree || echo "⚠️ final.tree file is missing!"
          echo "📜 Displaying first 20 lines of final.tree (if exists)..."
          head -n 20 ./analyzers/parse-en-us/input/doj.txt_log/final.tree || echo "⚠️ Unable to read final.tree!"
        

      - name: Full English Test
        uses: LouisBrunner/diff-action@v0.2.0
        with:
          old: .github/workflows/tests/parse-en-us/final.tree
          new: ./analyzers/parse-en-us/input/doj.txt_log/final.tree
          mode: addition
          tolerance: same
          output: parse-en-us-diff-lin.txt