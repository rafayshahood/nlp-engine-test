name: Linux

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
      
jobs:
  build_engine:
    name: Build NLP-ENGINE
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, ubuntu-20.04] 
        

    env:
      VCPKG_DEFAULT_TRIPLET: x64-linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Install Required Dependencies
        run: |
          sudo apt update
          sudo apt install -y autoconf-archive pkg-config python3 ninja-build build-essential cmake g++ git curl zip unzip tar
         

          if [[ "${{ matrix.os }}" == "ubuntu-20.04" ]]; then
            echo "===== [DEBUG] OS and Initial Versions ====="
            lsb_release -a || true
            uname -a
            echo "ICU Version:" && dpkg -l | grep libicu || true
            echo "glibc Version:" && ldd --version | head -n 1
            echo "Python Version:" && python3 --version
            echo "Gawk Version:" && gawk --version | head -n 1 || echo "gawk not installed"
            echo "Bison Version:" && bison --version | head -n 1 || echo "bison not installed"

             echo "===== Adding Jammy Repo for ICU 70 ====="
            echo "deb http://archive.ubuntu.com/ubuntu jammy main universe" | sudo tee -a /etc/apt/sources.list
            sudo apt update
            sudo apt install -y libicu70 libicu-dev gawk bison texinfo

            echo "===== Installing glibc 2.35 ====="
            wget http://ftp.gnu.org/gnu/libc/glibc-2.35.tar.gz
            tar -xvzf glibc-2.35.tar.gz
            cd glibc-2.35
            mkdir build
            cd build
            ../configure --prefix=/opt/glibc-2.35
            make -j$(nproc)
            sudo make install

            echo 'export LD_LIBRARY_PATH=/opt/glibc-2.35/lib:$LD_LIBRARY_PATH' >> ~/.bashrc
            echo 'export LIBRARY_PATH=/opt/glibc-2.35/lib:$LIBRARY_PATH' >> ~/.bashrc
            echo 'export C_INCLUDE_PATH=/opt/glibc-2.35/include:$C_INCLUDE_PATH' >> ~/.bashrc
            echo 'export CPLUS_INCLUDE_PATH=/opt/glibc-2.35/include:$CPLUS_INCLUDE_PATH' >> ~/.bashrc
            source ~/.bashrc

            echo "===== [DEBUG] Post-Install Versions ====="
            echo "glibc Version:" && /opt/glibc-2.35/lib/ld-*.so --version || true
          fi


      - name: Vcpkg Bootstrap Shell
        run: ./bootstrap-vcpkg.sh
        shell: bash
        working-directory: vcpkg

      - name: Install 3rd Party
        run: vcpkg install
        working-directory: vcpkg

      - name: Create Build Directory
        run: mkdir -p build

      - name: Generate Solution Linux
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-20.04" ]]; then
            export LD_LIBRARY_PATH=/opt/glibc-2.35/lib:$LD_LIBRARY_PATH
            export LIBRARY_PATH=/opt/glibc-2.35/lib:$LIBRARY_PATH
            export C_INCLUDE_PATH=/opt/glibc-2.35/include:$C_INCLUDE_PATH
            export CPLUS_INCLUDE_PATH=/opt/glibc-2.35/include:$CPLUS_INCLUDE_PATH

            export CC="gcc -Wl,--rpath=/opt/glibc-2.35/lib"
            export CXX="g++ -Wl,--rpath=/opt/glibc-2.35/lib"

            cmake -DCMAKE_BUILD_TYPE=Release \
                  -DVCPKG_BUILD_TYPE=release \
                  -B build -S . \
                  -DCMAKE_TOOLCHAIN_FILE='${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake'
          else
            cmake -DCMAKE_BUILD_TYPE=Release \
                  -DVCPKG_BUILD_TYPE=release \
                  -B build -S . \
                  -DCMAKE_TOOLCHAIN_FILE='${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake'
          fi

      - name: Cmake Build all targets Linux
        run: cmake --build build/ --target all


      - name: Test executable --version
        run: ./bin/nlp --version || true

      - name: Copy nlp.exe to nlpl.exe
        run: cp bin/nlp bin/nlpl.exe
        shell: bash


      # ✅ Upload Executable with Updated Naming
      - name: Upload nlpl.exe (Ubuntu 20.04)
        if: matrix.os == 'ubuntu-20.04'
        uses: actions/upload-artifact@v4
        with:
          name: nlpl-ubuntu-20.04.exe
          path: bin/nlpl.exe

      - name: Upload nlpl.exe (Ubuntu 22.04)
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: nlpl-ubuntu-22.04.exe
          path: bin/nlpl.exe

      - name: Upload nlpl.exe (Ubuntu Latest)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nlpl-ubuntu-latest.exe
          path: bin/nlpl.exe


      # ✅ Upload Libraries with Updated Naming
      - name: Upload libicutu (Ubuntu 20.04)
        if: matrix.os == 'ubuntu-20.04'
        uses: actions/upload-artifact@v4
        with:
          name: libicutu-ubuntu-20.04.a
          path: vcpkg_installed/x64-linux/lib/libicutu.a

      - name: Upload libicutu (Ubuntu 22.04)
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: libicutu-ubuntu-22.04.a
          path: vcpkg_installed/x64-linux/lib/libicutu.a

      - name: Upload libicutu (Ubuntu Latest)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: libicutu-ubuntu-latest.a
          path: vcpkg_installed/x64-linux/lib/libicutu.a

      - name: Upload libicuuc (Ubuntu 20.04)
        if: matrix.os == 'ubuntu-20.04'
        uses: actions/upload-artifact@v4
        with:
          name: libicuuc-ubuntu-20.04.a
          path: vcpkg_installed/x64-linux/lib/libicuuc.a

      - name: Upload libicuuc (Ubuntu 22.04)
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: libicuuc-ubuntu-22.04.a
          path: vcpkg_installed/x64-linux/lib/libicuuc.a

      - name: Upload libicuuc (Ubuntu Latest)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: libicuuc-ubuntu-latest.a
          path: vcpkg_installed/x64-linux/lib/libicuuc.a


      - name: Checkout Analyzers Repo
        uses: actions/checkout@v3
        with:
          repository: VisualText/analyzers
          submodules: recursive
          path: analyzers

      - name: Run English Parser Test
        run: ./bin/nlp -ANA ./analyzers/parse-en-us -WORK ./ ./analyzers/parse-en-us/input/doj.txt -DEV || true


      - name: Full English Test
        uses: LouisBrunner/diff-action@v0.2.0
        with:
          old: .github/workflows/tests/parse-en-us/final.tree
          new: ./analyzers/parse-en-us/input/doj.txt_log/final.tree
          mode: addition
          tolerance: same
          output: parse-en-us-diff-lin.txt